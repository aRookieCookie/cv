<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
    :root{
        --background-rgb: 9, 4, 9;
        --background: #090409;
    }

        body {
            background-color: var(--background);
            width: 100vw;
            height: 100vh;


            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 100px;
            height: 100px;
            background-color: #cd48d9;
        }

        .box::after {
            content: "";
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(var(--background-rgb), 0) 0%, rgba(var(--background-rgb), 1) 90%);
        }

    </style>
</head>
<body>

    <div class="box"></div> 
    
</body>
</html>
